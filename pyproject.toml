[project]
name = "ponte-a2a-mcp"
version = "1.0.0"
description = "Servidor MCP e agente A2A deterministico para reserva de salas."
requires-python = ">=3.10"
dependencies = [
  "a2a-sdk==1.3.1",
  "httpx==0.29.0",
  "mcp==2.3.0",
  "starlette==0.52.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.uv]
package = false
